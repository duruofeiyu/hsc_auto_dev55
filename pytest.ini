[pytest]
# 默认参数
# 注意: -n auto 需要安装 pytest-xdist (pip install pytest-xdist)
addopts = -v --tb=short --alluredir=./reports/allure-results

# 测试目录
testpaths = system_management ui_tests

# 标记定义
markers =
    smoke: 冒烟测试
    p1: 优先级1
    p2: 优先级2
    compliance: 合规运营模块
    system: 系统管理模块

# 最低 Python 版本
minversion = 3.8

# 控制台输出风格
console_output_style = progress

# 日志输出到控制台（默认关闭，需要时用 -s 开启）
log_cli = false

# 警告过滤
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::DeprecationWarning
