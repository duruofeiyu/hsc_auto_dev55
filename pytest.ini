[pytest]
# 默认参数
# 注意: -n auto 需要安装 pytest-xdist (pip install pytest-xdist)
addopts = -v --tb=short --alluredir=./reports/allure-results

# 测试目录（仅接口模块）。UI 自动化不进默认收集、需单独跑：
#   ui/py       新 UI 用例（Midscene 视觉，真实用例需内网+模型配置；离线自测在 test_flow_driver.py）
#   ui/tests    存量 Playwright 选择器用例（工单等）+ 全体系登录基建
#   ui/midscene JS 执行内核（自带入口：npm test / run-yaml.js）
testpaths = system_management asset_management vuln_management compliance_operations

# 标记定义
markers =
    smoke: 冒烟测试
    p1: 优先级1
    p2: 优先级2
    slow: 慢速测试（网络/大循环类）
    compliance: 合规运营模块
    system: 系统管理模块

# 最低 Python 版本
minversion = 3.8

# 控制台输出风格
console_output_style = progress

# 日志输出到控制台（默认关闭，需要时用 -s 开启）
log_cli = false

# 警告过滤
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::DeprecationWarning
