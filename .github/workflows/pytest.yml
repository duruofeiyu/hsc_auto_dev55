name: HSC Automation CI（质量门禁 + 内网手动回归）

# 设计原则（2026-09-16 重构）：CI 上只跑【GitHub 机器做得到的事】。
# 内网（192.168.x 私网）与模型网关从 GitHub 托管 Runner 不可达——
# 历史上 push 触发的接口全量跑 5 次全部空转 30 分钟被 timeout 取消，
# 413 条 FAILED 全是"连不上"而非用例错误（同码在本机全绿）。
# 因此真实回归在本机跑（./venv/bin/pytest ...），CI 只做秒级门禁。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── push / PR 自动跑：秒级质量门禁（不需要内网、不需要任何密钥）──
  quality-gate:
    name: Quality gate (no intranet needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 收集检查：413 条接口用例全部可 import、parametrize 的 YAML 数据文件全部可加载、
      # pytest.ini/conftest 无语法错——收集阶段就完成，纯离线、秒级
      - name: Collect-only sanity check
        run: pytest --collect-only -q

      # UI 驱动层解析单测：回归 run-yaml 输出解析的真实历史 bug
      # （✗ 乱序归因、多行 JSON 提取丢失）。纯逻辑零外部依赖
      - name: UI driver parser unit test
        run: pytest ui/py/test_flow_parser.py -v --tb=short

  # ── 手动触发：接口全量回归。仅当 Runner 可达内网时结果才有意义 ──
  # （GitHub 托管机不可达 → 需在自托管 Runner/VPN 环境点 Run workflow，
  #  或接受这里跑出来的都是连不上的红，仅用于验证跑测流程与报告管线）
  interface-full:
    name: Interface full run (needs intranet; manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (interface)
        env:
          HSC_TOKEN: ${{ secrets.HSC_TOKEN }}
        run: pytest -v --tb=short --alluredir=./reports/allure-results
        continue-on-error: true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 7

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-history
          retention-days: 7

  # ── 手动触发：存量 Playwright 选择器 UI 用例（同样需内网）──
  ui-e2e:
    name: HSC55 UI Automation (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run UI tests
        env:
          HSC_UI_USER: ${{ secrets.HSC_UI_USER }}
          HSC_UI_PASSWORD: ${{ secrets.HSC_UI_PASSWORD }}
        run: pytest ui/tests -v --tb=short --alluredir=./reports/allure-results
        continue-on-error: true

      - name: Upload UI Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-allure-results
          path: reports/allure-results
          retention-days: 7
