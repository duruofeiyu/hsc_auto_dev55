name: HSC Interface Automation (55/123)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          HSC_TOKEN: ${{ secrets.HSC_TOKEN }}
        # testpaths 已在 pytest.ini 配置为 4 个接口模块（system_management/asset_management/vuln_management/compliance_operations）
        run: pytest -v --tb=short --alluredir=./reports/allure-results
        continue-on-error: true

      # UI 驱动层解析单测（纯 Python，不需要 node/chromium/模型）：
      # 回归历史上真正的 UI 侧 bug——run-yaml 输出解析（✗ 归因、多行 JSON 提取）。
      # 真实 UI 用例（test_flow_driver / 各业务 flow）需内网+模型，不放进 CI job1。
      - name: UI driver parser unit test
        run: pytest ui/py/test_flow_parser.py -v --tb=short

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 7

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: logs
          retention-days: 7

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: reports/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-history
          retention-days: 7

  ui-e2e:
    name: HSC55 UI Automation (E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 目标环境为内网 192.168.124.55，GitHub 托管 Runner 无法访问，
    # 故设为手动触发（Actions 页面 → Run workflow），仅在有可达环境
    # （自托管 Runner / VPN / 本地 act）时运行。
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Run UI tests
        env:
          HSC_UI_USER: ${{ secrets.HSC_UI_USER }}
          HSC_UI_PASSWORD: ${{ secrets.HSC_UI_PASSWORD }}
        run: pytest ui/tests -v --tb=short --alluredir=./reports/allure-results
        continue-on-error: true

      - name: Upload UI Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-allure-results
          path: reports/allure-results
          retention-days: 7
