# ============================================================================
# HSC 脆弱性管理 → 系统漏洞管理（/assetsVuln）→ 漏洞总览页签
# 对应 bridge_hsc.mjs 已验证的思路（DOM 主力 + AI 一次交叉验证）
# ============================================================================
# DOM 侧踩过并绕开的坑（来自 bridge_hsc v7-v10 注释，别改回去）：
#   ① Element UI 的表头在 .el-table__header-wrapper 单独一张 table（没有 tbody 行），
#      按裸 <table> 收集会拿不到表头；
#   ② 固定列会渲染副表 .el-table__fixed，不排除会把行重复计数；
#   ③ 页面上数到的「待处理」只是**本页可见行**，全库总数要读分页「共 X 条」；
#      要精确全库总数得走 UI 筛选（见 bridge --pending），本流程不做筛选（写操作）。
# ============================================================================

page:
  url: /assetsVuln

tasks:
  # --------------------------------------------------------------------------
  # 任务 0｜环境体检（每条 UI 用例的第 0 步：先分清环境问题和用例问题）
  # --------------------------------------------------------------------------
  - name: "[前置] 页面健康检查"
    continueOnError: true
    flow:
      - javascript: |
          const url = location.href;
          if (/\/login(\/|\?|#|$)/.test(url)) {
            throw new Error('被重定向到登录页：' + url + '  → 先跑 npm run auth:force');
          }
          const t = (document.body.innerText || '').replace(/\s+/g, '');
          if (t.length < 400 && /服务器出错|服务器错误/.test(t)) {
            throw new Error('页面停在「服务器出错」错误页，不是业务页面（环境问题，不是用例问题）');
          }
          if (!t.includes('漏洞总览')) {
            throw new Error('页面没有渲染出「漏洞总览」（后端接口可能挂了或路由不对）');
          }
          return 'OK，已在系统漏洞管理页';
        name: page_health

  # --------------------------------------------------------------------------
  # 任务 1｜页签激活态校验 —— 确定性靠 DOM class，不问 AI
  # 不通过就整轮判失败，绝不"带病"进后面的读数
  # --------------------------------------------------------------------------
  - name: "页签校验：「漏洞总览」必须处于激活态"
    continueOnError: true
    flow:
      - javascript: |
          // 若默认激活的不是「漏洞总览」，用 DOM 精确点过去（零 AI、零误差）
          const items = Array.from(document.querySelectorAll('.el-tabs__item'));
          const want = items.find((el) => (el.textContent || '').trim() === '漏洞总览');
          if (!want) throw new Error('页面上找不到「漏洞总览」页签');
          if (!/is-active/.test(String(want.className || ''))) {
            want.click();
          }
          return 'clicked=' + (String(want.className || '').includes('is-active') ? 'already' : 'now');
        name: tab_click
      - javascript: |
          // 等 Vue 渲染一拍后复核激活态（确定性判断，不花 AI）
          await new Promise((r) => setTimeout(r, 800));
          const active = Array.from(document.querySelectorAll('.el-tabs__item.is-active'))
            .map((el) => (el.textContent || '').trim());
          if (!active.includes('漏洞总览')) {
            throw new Error('激活页签不是「漏洞总览」，实际=' + JSON.stringify(active));
          }
          return 'OK，激活页签=' + JSON.stringify(active);
        name: tab_active_check

  # --------------------------------------------------------------------------
  # 任务 2｜DOM 读表格（主力断言层）
  # 以 .el-table 容器为统计单元（天然避开表头/固定列副表），
  # 输出「状态」列取值分布做逐行自证 —— 哪个列、几行待处理，一目了然
  # --------------------------------------------------------------------------
  - name: "TC-VULN-001 漏洞总览-表格与状态分布（DOM 主力）"
    continueOnError: true
    flow:
      - aiWaitFor: 页面中出现了数据表格
        timeout: 15000
      - javascript: |
          const norm = (s) => String(s || '').replace(/\s+/g, ' ').trim();
          const tables = Array.from(document.querySelectorAll('.el-table'))
            .filter((el) => !el.closest('.el-table__fixed'));
          if (!tables.length) throw new Error('页面没有 .el-table 表格');
          // 取行数最多的容器作为主表
          let best = null, bestRows = -1;
          for (const c of tables) {
            const rows = Array.from(c.querySelectorAll('.el-table__body-wrapper tbody tr'))
              .filter((tr) => tr.querySelector('td'));
            if (rows.length > bestRows) { best = c; bestRows = rows.length; }
          }
          const headerWrap = best.querySelector('.el-table__header-wrapper') || best.querySelector('.el-table__header');
          const headers = headerWrap
            ? Array.from(headerWrap.querySelectorAll('th')).map((th) => norm(th.textContent))
            : [];
          const rows = Array.from(best.querySelectorAll('.el-table__body-wrapper tbody tr'))
            .filter((tr) => tr.querySelector('td'))
            .map((tr) => Array.from(tr.querySelectorAll('td')).map((td) => norm(td.textContent)));
          // 定位「状态」列：表头含"状态"，或退化为值域含"待处理"的列
          let col = headers.findIndex((h) => h.includes('状态'));
          const dist = {};
          const pendingRows = [];
          if (col >= 0) {
            rows.forEach((cells, i) => {
              const v = cells[col] || '-';
              dist[v] = (dist[v] || 0) + 1;
              if (v.includes('待处理')) pendingRows.push(i + 1);
            });
          }
          // 分页「共 X 条」= 全库总数（本页行数只是它的一个子集）
          const pageText = (document.querySelector('.el-pagination') || {}).innerText || '';
          const totalMatch = pageText.match(/共\s*(\d+)\s*条/);
          const out = {
            headers: headers.filter(Boolean),
            rowCount: rows.length,
            statusCol: col,
            statusDist: dist,
            pendingCount: pendingRows.length,
            pendingRowNos: pendingRows.slice(0, 20),
            paginationTotal: totalMatch ? Number(totalMatch[1]) : null,
          };
          // 自证合理性：本页行数不得超过全库总数；状态分布总数=行数
          const sum = Object.values(dist).reduce((a, b) => a + b, 0);
          if (col >= 0 && sum !== rows.length) throw new Error('状态分布行数(' + sum + ')≠实际行数(' + rows.length + ')，定位有歧义');
          if (out.paginationTotal != null && rows.length > out.paginationTotal) {
            throw new Error('本页行数(' + rows.length + ') > 分页总数(' + out.paginationTotal + ')，数据不自洽');
          }
          return JSON.stringify(out);
        name: dom_table

  # --------------------------------------------------------------------------
  # 任务 3｜AI 交叉验证（只此一次；旁证角色，不当唯一依据）
  # --------------------------------------------------------------------------
  - name: "TC-VULN-001 漏洞总览-AI 读本页待处理行数（交叉验证）"
    continueOnError: true
    flow:
      - aiQuery: '当前页面的数据表格中，「状态」这一列的值包含「待处理」字样的行有几行？只返回 JSON：{"count": 数字}'
        name: ai_pending

  # --------------------------------------------------------------------------
  # 任务 4｜数据驱动演示（可选 --var EXPECT_TOTAL=21 → 钉全库总数）
  # --------------------------------------------------------------------------
  - name: "变量演示 · 全库漏洞总数 = {{EXPECT_TOTAL}}"
    continueOnError: true
    flow:
      - javascript: |
          const EXPECT = '{{EXPECT_TOTAL}}';
          if (!EXPECT || EXPECT.indexOf('{{') === 0) return '未传 EXPECT_TOTAL，跳过比对';
          const pageText = (document.querySelector('.el-pagination') || {}).innerText || '';
          const m = pageText.match(/共\s*(\d+)\s*条/);
          const actual = m ? Number(m[1]) : null;
          if (String(actual) !== String(EXPECT)) {
            throw new Error('分页总数不一致：期望 ' + EXPECT + '，实际 ' + actual);
          }
          return '一致：全库总数=' + actual;
        name: expect_total_check
