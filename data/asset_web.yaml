# 网站(Web)资产模块 - 数据驱动测试数据
# 文件: data/asset_web.yaml

# ======================== 1. 查询 Web 资产列表 ========================
test_query_web:
  - name: "默认查询Web资产列表"
    input: {}
    expected:
      success: true

  - name: "按名称关键字查询"
    input:
      keyword: "测试"
    expected:
      success: true

  - name: "按URL查询"
    input:
      keyword: "example.com"
    expected:
      success: true

  - name: "分页查询-每页5条"
    input:
      pageSize: 5
    expected:
      success: true
      max_records: 5

  - name: "无结果关键字查询"
    input:
      keyword: "不存在的关键字xyz"
    expected:
      success: true
      max_records: 0

# ======================== 2. 新增 Web 资产 ========================
test_create_web:
  - name: "正常新增Web资产"
    input: {}
    expected:
      success: true

  - name: "新增-内网资产"
    input:
      payload:
        is_intranet: true
    expected:
      success: true

  - name: "新增-名称为空"
    input:
      payload:
        asset_name: ""
    expected:
      success: false

  - name: "新增-URL为空"
    input:
      payload:
        url: ""
    expected:
      success: false

  - name: "新增-非法URL"
    input:
      payload:
        url: "not-a-valid-url"
    expected:
      success: false

# ======================== 3. 编辑 Web 资产 ========================
test_update_web:
  - name: "编辑-修改负责人"
    input:
      payload:
        owner: "YAML新负责人"
    expected:
      success: true

  - name: "编辑-修改ICP备案号"
    input:
      payload:
        icp_rec_num: "粤ICP备20260001号"
    expected:
      success: true

  - name: "编辑-修改备注"
    input:
      payload:
        remark: "YAML修改备注"
    expected:
      success: true

# ======================== 4. 删除 Web 资产（固定 ID 异常场景） ========================
test_delete_web:
  - name: "删除不存在的ID"
    input:
      web_id: "9999999999999999999"
    expected:
      success: false

  - name: "删除-非法ID格式"
    input:
      web_id: "not-a-valid-id"
    expected:
      success: false
