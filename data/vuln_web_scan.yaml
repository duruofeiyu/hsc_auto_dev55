# Web 漏洞扫描任务模块 - 数据驱动测试数据
# 文件: data/vuln_web_scan.yaml

# ======================== 1. 创建 Web 漏洞扫描任务 ========================
test_create_web_scan:
  - name: "正常创建 Web 漏洞扫描任务"
    input: {}
    expected:
      success: true

  - name: "创建-任务名为空"
    input:
      payload:
        task_name: ""
    expected:
      success: false

  - name: "创建-扫描目标为空"
    input:
      payload:
        scan_target: ""
    expected:
      success: false

  - name: "创建-非法扫描目标（纯IP）"
    input:
      payload:
        scan_target: "192.168.1.1"
    expected:
      success: false
      xfail: "已知缺陷：scanTarget 纯IP未校验，静默创建成功"

  - name: "创建-爬行深度为负数"
    input:
      payload:
        scan_depth: -1
    expected:
      success: false
      xfail: "已知缺陷：scanDepth=-1 未校验静默创建（与 web_map 同类）"

  - name: "创建-非法爬行策略"
    input:
      payload:
        crawl_strategy: "INVALID"
    expected:
      success: false
      xfail: "已知缺陷：crawlStrategy 非法值未校验，静默创建成功"

  - name: "创建-非法扫描级别"
    input:
      payload:
        scan_level: 999
    expected:
      success: false
      xfail: "已知缺陷：scanLevel 越界未校验，静默创建成功"

  - name: "创建-并发数为 0"
    input:
      payload:
        concurrency: 0
    expected:
      success: false
      xfail: "已知缺陷：concurrency=0 未校验，静默创建成功"

# ======================== 2. 查询 Web 漏洞扫描任务列表 ========================
test_query_web_scan:
  - name: "默认查询 Web 漏洞扫描任务列表"
    input: {}
    expected:
      success: true

  - name: "按关键字查询"
    input:
      keyword: "Web"
    expected:
      success: true

# ======================== 3. 删除 Web 漏洞扫描任务（固定 ID 异常场景） ========================
test_delete_web_scan:
  - name: "删除不存在的任务ID"
    input:
      task_id: "9999999999999999999"
    expected:
      success: false
