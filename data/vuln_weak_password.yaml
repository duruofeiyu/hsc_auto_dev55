# 弱口令检测任务模块 - 数据驱动测试数据
# 文件: data/vuln_weak_password.yaml

# ======================== 1. 创建弱口令检测任务 ========================
test_create_weak_password:
  - name: "正常创建弱口令检测任务"
    input: {}
    expected:
      success: true

  - name: "创建-任务名为空"
    input:
      payload:
        task_name: ""
    expected:
      success: false

  - name: "创建-扫描目标为空"
    input:
      payload:
        scan_target: ""
    expected:
      success: false

  - name: "创建-IP 范围目标"
    input:
      payload:
        scan_target: "192.168.124.1-192.168.124.10"
    expected:
      success: true

  - name: "创建-CIDR 网段目标"
    input:
      payload:
        scan_target: "192.168.124.0/24"
    expected:
      success: true

  - name: "创建-非法扫描目标"
    input:
      payload:
        scan_target: "999.999.1.1"
    expected:
      success: false

  - name: "创建-空服务列表"
    input:
      payload:
        services: ""
    expected:
      success: false
      xfail: "已知缺陷：services 为空未校验，静默创建成功"

  - name: "创建-非法服务类型"
    input:
      payload:
        services: "invalid-service"
    expected:
      success: false
      xfail: "已知缺陷：services 非法值未校验，静默创建成功"

  - name: "创建-非法策略 ID"
    input:
      payload:
        strategy_id: 999999
    expected:
      success: false
      xfail: "已知缺陷：strategyId 越界未校验，静默创建成功"

# ======================== 2. 查询弱口令检测任务列表 ========================
test_query_weak_password:
  - name: "默认查询弱口令检测任务列表"
    input: {}
    expected:
      success: true

  - name: "按关键字查询"
    input:
      keyword: "弱口令"
    expected:
      success: true

# ======================== 3. 删除弱口令检测任务（固定 ID 异常场景） ========================
test_delete_weak_password:
  - name: "删除不存在的任务ID"
    input:
      task_id: "9999999999999999999"
    expected:
      success: false
