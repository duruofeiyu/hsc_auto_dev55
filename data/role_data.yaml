# 角色管理模块 - 数据驱动测试数据
# 文件: data/role_data.yaml
# 注意：角色创建/编辑/删除接口需要 x-sign 签名头校验，当前未实现签名算法，
# 因此角色写操作相关用例采用记录型断言，签名失败时 skip。

# ======================== 1. 角色列表查询 ========================
test_query_role_list:
  - name: "默认查询角色列表"
    input:
      condition: {}
      pageNum: 1
      pageSize: 10
    expected:
      success: true
      code: 200
      max_records: 10

  - name: "分页查询角色列表"
    input:
      condition: {}
      pageNum: 1
      pageSize: 5
    expected:
      success: true
      code: 200
      max_records: 5

  - name: "按角色名称搜索"
    input:
      condition:
        roleName: "管理员"
      pageNum: 1
      pageSize: 10
    expected:
      success: true
      code: 200

  - name: "按角色状态搜索"
    input:
      condition:
        roleStatus: 0
      pageNum: 1
      pageSize: 10
    expected:
      success: true
      code: 200

# ======================== 2. 新增角色 ========================
test_create_role:
  - name: "正常新增角色"
    input:
      role_name: "YAML测试角色"
      role_key: "yaml_role_001"
      role_status: 0
      role_sort: 1
    expected:
      success: true
      code: 200

  - name: "新增角色并分配菜单"
    input:
      role_name: "YAML菜单角色"
      role_key: "yaml_role_002"
      role_status: 0
      menu_ids:
        - "1"
        - "228"
        - "5079"
    expected:
      success: true
      code: 200

  - name: "新增停用状态角色"
    input:
      role_name: "YAML停用角色"
      role_key: "yaml_role_003"
      role_status: 1
    expected:
      success: true
      code: 200

  - name: "必填项校验-角色名称为空"
    input:
      role_name: ""
      role_key: "yaml_role_004"
    expected:
      success: false

  - name: "必填项校验-角色标识为空"
    input:
      role_name: "YAML测试角色"
      role_key: ""
    expected:
      success: false

  - name: "角色标识重复应失败"
    input:
      role_name: "YAML重复角色"
      role_key: "yaml_role_001"
    expected:
      success: false

# ======================== 3. 编辑角色 ========================
test_update_role:
  - name: "编辑角色名称"
    input:
      role_name: "YAML编辑后角色"
      is_update: true
    expected:
      success: true
      code: 200

  - name: "编辑角色状态为停用"
    input:
      role_status: 1
      is_update: true
    expected:
      success: true
      code: 200

  - name: "编辑角色数据权限"
    input:
      data_scope: 4
      dept_ids: []
      is_update: true
    expected:
      success: true
      code: 200

# ======================== 4. 删除角色 ========================
test_delete_role:
  - name: "删除不存在的角色"
    input:
      role_id: "9999999999999999999"
    expected:
      success: false

# ======================== 5. 分配用户 ========================
# 注意：分配用户需要先有角色，建议在测试中使用 temp_role fixture 创建角色
# 以下为接口格式验证数据，实际运行需要配合 fixture 使用
test_assign_users:
  - name: "给角色分配用户"
    input:
      role_id: "fixture_temp_role"
      user_ids: ["2"]
    expected:
      success: true
      code: 200
    note: "该用例需要配合 temp_role fixture 使用，role_id 由 fixture 提供"

# ======================== 6. 角色详情 ========================
# 注意：查询角色详情需要先有角色，建议在测试中使用 temp_role fixture
test_get_role_detail:
  - name: "查询角色详情"
    input:
      role_id: "fixture_temp_role"
    expected:
      success: true
      code: 200
    note: "该用例需要配合 temp_role fixture 使用，role_id 由 fixture 提供"
