# 资产探测任务模块 - 数据驱动测试数据
# 文件: data/probe_task.yaml
#
# 说明：参数校验类用例 expected=false（期望后端正确校验拒绝）。
# 部分校验项在 123 环境为「已提 bug」（未校验、可创建成功），
# 迁移到 55 后作为回归验证——若仍 success=true 则用例失败，暴露缺陷未修复。

# ======================== 1. 查询探测任务列表 ========================
test_query_probe:
  - name: "默认查询探测任务列表"
    input: {}
    expected:
      success: true

  - name: "按任务名关键字查询"
    input:
      keyword: "测试"
    expected:
      success: true

  - name: "分页查询-每页5条"
    input:
      pageSize: 5
    expected:
      success: true
      max_records: 5

# ======================== 2. 创建探测任务 ========================
test_create_probe:
  - name: "正常创建探测任务"
    input: {}
    expected:
      success: true

  - name: "创建-任务名称为空"
    input:
      payload:
        task_name: ""
    expected:
      success: false

  - name: "创建-扫描目标为空"
    input:
      payload:
        scan_target: ""
    expected:
      success: false

  - name: "创建-非法执行方式"
    input:
      payload:
        schedule_type: "INVALID_TYPE"
    expected:
      success: false

  - name: "创建-版本探测强度越界"
    input:
      payload:
        version_intensity: 999
    expected:
      success: false
      xfail: "已知缺陷未修复：versionIntensity 越界值(999)未校验，后端静默放行返回200"

  - name: "创建-扫描速度越界"
    input:
      payload:
        speed: 999
    expected:
      success: false

  - name: "创建-最大重试为负数"
    input:
      payload:
        max_retries: -1
    expected:
      success: false

  - name: "创建-主机超时为0"
    input:
      payload:
        host_timeout: 0
    expected:
      success: false

# ======================== 3. 编辑探测任务 ========================
test_update_probe:
  - name: "编辑-修改任务名称"
    input:
      payload:
        task_name: "__unique_name__"
    expected:
      success: true

  - name: "编辑-修改执行方式为禁用"
    input:
      payload:
        task_status: "DISABLED"
    expected:
      success: true

# ======================== 4. 删除探测任务（固定 ID 异常场景） ========================
test_delete_probe:
  - name: "删除不存在的ID"
    input:
      task_id: "9999999999999999999"
    expected:
      success: false

  - name: "删除-非法ID格式"
    input:
      task_id: "not-a-valid-id"
    expected:
      success: false
