# 物联网(IoT)资产模块 - 数据驱动测试数据
# 文件: data/asset_iot.yaml

# ======================== 1. 查询 IoT 资产列表 ========================
test_query_iot:
  - name: "默认查询IoT资产列表"
    input: {}
    expected:
      success: true

  - name: "按名称关键字查询"
    input:
      keyword: "测试"
    expected:
      success: true

  - name: "按品牌查询"
    input:
      keyword: "海康"
    expected:
      success: true

  - name: "分页查询-每页5条"
    input:
      pageSize: 5
    expected:
      success: true
      max_records: 5

  - name: "无结果关键字查询"
    input:
      keyword: "不存在的关键字xyz"
    expected:
      success: true
      max_records: 0

# ======================== 2. 新增 IoT 资产 ========================
test_create_iot:
  - name: "正常新增IoT资产"
    input: {}
    expected:
      success: true

  - name: "新增-全字段"
    input:
      payload:
        brand: "海康威视"
        protocol: "RTSP"
        firmware: "v2.1.0"
        serial_number: "SN20260001"
        mac: "AA:BB:CC:DD:EE:01"
    expected:
      success: true

  - name: "新增-非法IP格式"
    input:
      payload:
        ip: "999.999.1.1"
    expected:
      success: false

# ======================== 3. 编辑 IoT 资产 ========================
test_update_iot:
  - name: "编辑-修改品牌"
    input:
      payload:
        brand: "YAML新品牌"
    expected:
      success: true

  - name: "编辑-修改负责人"
    input:
      payload:
        owner: "YAML新负责人"
    expected:
      success: true

  - name: "编辑-修改固件版本"
    input:
      payload:
        firmware: "v3.0.0"
    expected:
      success: true

# ======================== 4. 删除 IoT 资产（固定 ID 异常场景） ========================
test_delete_iot:
  - name: "删除不存在的ID"
    input:
      iot_id: "9999999999999999999"
    expected:
      success: false

  - name: "删除-非法ID格式"
    input:
      iot_id: "not-a-valid-id"
    expected:
      success: false
