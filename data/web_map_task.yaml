# 网站测绘任务模块 - 数据驱动测试数据
# 文件: data/web_map_task.yaml

# ======================== 1. 查询网站测绘任务列表 ========================
test_query_web_map:
  - name: "默认查询网站测绘任务列表"
    input: {}
    expected:
      success: true

  - name: "按任务名关键字查询"
    input:
      keyword: "测试"
    expected:
      success: true

  - name: "分页查询-每页5条"
    input:
      pageSize: 5
    expected:
      success: true
      max_records: 5

# ======================== 2. 创建网站测绘任务 ========================
test_create_web_map:
  - name: "正常创建网站测绘任务"
    input: {}
    expected:
      success: true

  - name: "创建-任务名称为空"
    input:
      payload:
        task_name: ""
    expected:
      success: false

  - name: "创建-检测目标为空"
    input:
      payload:
        scan_target: ""
    expected:
      success: false

  - name: "创建-非法执行方式"
    input:
      payload:
        schedule_type: "INVALID_TYPE"
    expected:
      success: false

  - name: "创建-爬行深度为负数"
    input:
      payload:
        scan_depth: -1
    expected:
      success: false
      xfail: "已知缺陷未修复：爬行深度为负数(-1)未校验，后端静默放行返回200"

# ======================== 3. 编辑网站测绘任务 ========================
test_update_web_map:
  - name: "编辑-修改任务名称"
    input:
      payload:
        task_name: "__unique_name__"
    expected:
      success: true

  - name: "编辑-修改执行方式为禁用"
    input:
      payload:
        task_status: "DISABLED"
    expected:
      success: true

# ======================== 4. 删除网站测绘任务（固定 ID 异常场景） ========================
test_delete_web_map:
  - name: "删除不存在的ID"
    input:
      task_id: "9999999999999999999"
    expected:
      success: false

  - name: "删除-非法ID格式"
    input:
      task_id: "not-a-valid-id"
    expected:
      success: false
