[project]
name = "hsc-auto-dev55"
version = "1.0.0"
description = "HSC 55 开发环境接口自动化测试框架"
requires-python = ">=3.8"
authors = [
    { name = "chenyh" }
]

dependencies = [
    "pytest>=7.0",
    "requests>=2.28",
    "pyyaml>=6.0",
    "allure-pytest>=2.13",
    "pytest-html>=4.0",
    "urllib3>=1.26",
]

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "flake8",
    "pre-commit",
]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100
